<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.gstatic.com"
    crossorigin
    rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/article.css') }}">

    <title>{{ article['article_title'] }} — Blog Pessoal</title>
</head>
<body>

    <div id="edit-overlay" class="art__overlay"></div>

    <div id="edit-panel" class="art__edit-panel">
        <div class="edit-panel__header">
            <div class="edit-panel__header-left">
                <div class="edit-panel__header-icon u-flex-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                        <path d="M100.4 417.2C104.5 402.6 112.2 389.3 123 378.5L304.2 197.3L338.1 163.4C354.7 180 389.4 214.7 442.1 267.4L476 301.3L442.1 335.2L260.9 516.4C250.2 527.1 236.8 534.9 222.2 539L94.4 574.6C86.1 576.9 77.1 574.6 71 568.4C64.9 562.2 62.6 553.3 64.9 545L100.4 417.2zM156 413.5C151.6 418.2 148.4 423.9 146.7 430.1L122.6 517L209.5 492.9C215.9 491.1 221.7 487.8 226.5 483.2L155.9 413.5zM510 267.4C493.4 250.8 458.7 216.1 406 163.4L372 129.5C398.5 103 413.4 88.1 416.9 84.6C430.4 71 448.8 63.4 468 63.4C487.2 63.4 505.6 71 519.1 84.6L554.8 120.3C568.4 133.9 576 152.3 576 171.4C576 190.5 568.4 209 554.8 222.5C551.3 226 536.4 240.9 509.9 267.4z"/>
                    </svg>
                </div>

                <div>
                    <h3 class="edit-panel__title">Editar Artigo</h3>
                    <p class="edit-panel__subtitle">Altere os campos e salve</p>
                </div>
            </div>

            <button class="edit-panel__hide-btn u-flex-center"
            id="edit-panel-hide-btn"
            aria-label="Fechar editor">
                <svg aria-hidden="true"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M342.6 105.4C330.1 92.9 309.8 92.9 297.3 105.4L137.3 265.4C124.8 277.9 124.8 298.2 137.3 310.7C149.8 323.2 170.1 323.2 182.6 310.7L320 173.3L457.4 310.6C469.9 323.1 490.2 323.1 502.7 310.6C515.2 298.1 515.2 277.8 502.7 265.3L342.7 105.3zM502.6 457.4L342.6 297.4C330.1 284.9 309.8 284.9 297.3 297.4L137.3 457.4C124.8 469.9 124.8 490.2 137.3 502.7C149.8 515.2 170.1 515.2 182.6 502.7L320 365.3L457.4 502.6C469.9 515.1 490.2 515.1 502.7 502.6C515.2 490.1 515.2 469.8 502.7 457.3z"/>
                </svg>
            </button>
        </div>

        <div class="edit-panel__divider"></div>

        <form class="edit-panel__form"
        id="edit-form"
        novalidate>

            <div class="edit-panel__field">
                <label class="edit-panel__label" for="edit-input-title">
                    <svg class="edit-panel__label-icon"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M96 128C96 110.3 110.3 96 128 96L224 96C241.7 96 256 110.3 256 128C256 145.7 241.7 160 224 160L208 160L208 272L432 272L432 160L416 160C398.3 160 384 145.7 384 128C384 110.3 398.3 96 416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L496 160L496 480L512 480C529.7 480 544 494.3 544 512C544 529.7 529.7 544 512 544L416 544C398.3 544 384 529.7 384 512C384 494.3 398.3 480 416 480L432 480L432 336L208 336L208 480L224 480C241.7 480 256 494.3 256 512C256 529.7 241.7 544 224 544L128 544C110.3 544 96 529.7 96 512C96 494.3 110.3 480 128 480L144 480L144 160L128 160C110.3 160 96 145.7 96 128z"/>
                    </svg>
                    Título
                </label>

                <div class="edit-panel__input-wrap">
                    <input class="edit-panel__input"
                    id="edit-input-title"
                    name="title"
                    type="text"
                    placeholder="Título do artigo…"
                    autocomplete="off"
                    maxlength="30"
                    required>
                </div>

                <span class="edit-panel__error"
                id="edit-title-error"
                aria-live="polite"></span>
                <span id="edit-title-counter" class="edit-panel__counter">0 / 30</span>
            </div>

            <div class="edit-panel__field">
                <label class="edit-panel__label" for="edit-input-content">
                    <svg class="edit-panel__label-icon"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M544 128C544 110.3 529.7 96 512 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128zM544 384C544 366.3 529.7 352 512 352L128 352C110.3 352 96 366.3 96 384C96 401.7 110.3 416 128 416L512 416C529.7 416 544 401.7 544 384zM96 256C96 273.7 110.3 288 128 288L512 288C529.7 288 544 273.7 544 256C544 238.3 529.7 224 512 224L128 224C110.3 224 96 238.3 96 256zM544 512C544 494.3 529.7 480 512 480L128 480C110.3 480 96 494.3 96 512C96 529.7 110.3 544 128 544L512 544C529.7 544 544 529.7 544 512z"/>
                    </svg>
                    Conteúdo
                </label>

                <div class="edit-panel__input-wrap">
                    <textarea class="edit-panel__input edit-panel__textarea"
                    id="edit-input-content"
                    name="content"
                    placeholder="Conteúdo do artigo…"
                    maxlength="2500"
                    rows="6"></textarea>
                </div>

                <span id="edit-content-counter" class="edit-panel__counter">0 / 2500</span>
            </div>

            <div class="edit-panel__actions">
                <button class="edit-panel__cancel-btn"
                id="edit-cancel-btn"
                type="button">Cancelar</button>
                <button class="edit-panel__submit-btn"
                id="edit-submit-btn"
                type="submit">
                    <span class="edit-panel__submit-text">Salvar</span>
                    <span class="edit-panel__submit-spinner" aria-hidden="true"></span>
                </button>
            </div>

        </form>
    </div>

    <main class="art__main"
    data-article-id="{{ article['article_id'] }}">

        <header class="art__header">
            <a class="art__back-btn u-flex-center"
            href="/"
            aria-label="Voltar para a página inicial">
                <svg aria-hidden="true"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M9.4 278.6C-3.1 291.1-3.1 311.4 9.4 323.9L233.4 547.9C245.9 560.4 266.2 560.4 278.7 547.9C291.2 535.4 291.2 515.1 278.7 502.6L118.1 342L608 342C625.7 342 640 327.7 640 310C640 292.3 625.7 278 608 278L118.1 278L278.6 117.4C291.1 104.9 291.1 84.6 278.6 72.1C266.1 59.6 245.8 59.6 233.3 72.1L9.4 278.6z"/>
                </svg>
                <span>Voltar</span>
            </a>

            <div class="art__header-meta">
                <span class="art__id-badge">ID: {{ article['article_id'] }}</span>
                <time class="art__date" datetime="{{ article['publish_date'] }}">
                    {{ article['publish_date'].strftime('%d/%m/%Y') }}
                </time>
            </div>

            <button class="art__edit-btn u-flex-center"
            id="edit-btn"
            aria-label="Editar artigo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M100.4 417.2C104.5 402.6 112.2 389.3 123 378.5L304.2 197.3L338.1 163.4C354.7 180 389.4 214.7 442.1 267.4L476 301.3L442.1 335.2L260.9 516.4C250.2 527.1 236.8 534.9 222.2 539L94.4 574.6C86.1 576.9 77.1 574.6 71 568.4C64.9 562.2 62.6 553.3 64.9 545L100.4 417.2zM156 413.5C151.6 418.2 148.4 423.9 146.7 430.1L122.6 517L209.5 492.9C215.9 491.1 221.7 487.8 226.5 483.2L155.9 413.5zM510 267.4C493.4 250.8 458.7 216.1 406 163.4L372 129.5C398.5 103 413.4 88.1 416.9 84.6C430.4 71 448.8 63.4 468 63.4C487.2 63.4 505.6 71 519.1 84.6L554.8 120.3C568.4 133.9 576 152.3 576 171.4C576 190.5 568.4 209 554.8 222.5C551.3 226 536.4 240.9 509.9 267.4z"/>
                </svg>
                <span>Editar</span>
            </button>
        </header>

        <article class="art__body">
            <h1 class="art__title" id="view-title">{{ article['article_title'] }}</h1>
            <p class="art__content" id="view-content">{{ article['article_content'] }}</p>
        </article>

    </main>

    <script src="{{ url_for('static', filename='js/article.js') }}"></script>
</body>
</html>
