<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
    <title>Blog Pessoal</title>
</head>
<body>
    <main>
        <header>
            <h1>BLOG Pessoal</h1>
            <section class="manipulate-articles">
                <button id="add-button">
                    <svg class="add-icon"
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 512 512"><path 
                    fill="#2828dc" 
                    d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 344l0-64-64 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l64 0 0-64c0-13.3 10.7-24 24-24s24 10.7 24 24l0 64 64 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-64 0 0 64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"/></svg>
                    <p>Adicionar<br>artigo</p>
                </button>
                <button id="remove-button">
                    <svg class="remove-icon" 
                    xmlns="http://www.w3.org/2000/svg" 
                    viewBox="0 0 512 512"><path 
                    fill="#2828dc" 
                    d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM184 232l144 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-144 0c-13.3 0-24-10.7-24-24s10.7-24 24-24z"/>
                    </svg>
                    <p>Remover<br>artigo</p>
                </button>
            </section>
        </header>

        <section class="search-articles">
            <button>
                <svg class="search-icon"
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 512 512"><path 
                fill="#FFD43B" 
                d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
                </svg>
            </button>
        </section>
    </main>

    <section class="articles-list-section">
        <h2>Seus Artigos</h2>
        <ul id="articles-list"></ul>
    </section>

    <div id="add-popup-overlay" class="popup-overlay">
        <div class="add-popup popup">
            <button class="cancel-button">
                <svg class="remove-icon"
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 384 512"><path
                fill="#000000" 
                d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                </svg>
            </button>
            <h2>Adicionar artigo</h2>
            <form id="add-form">
                <div class="add-inputs">
                    <label for="new-title-input">Titulo</p>
                    <input name="new-title" id="new-title-input" type="text" required autocomplete="off">
                    <label for="new-content-input">Conteúdo</p>
                    <textarea name="new-content" 
                    id="new-content-input"
                    type="text"
                    rows="4"></textarea>
                </div>
                <button id="add-confirm" 
                type="submit">Confirmar</button>
            </form>
        </div>
    </div>

    <div id="remove-popup-overlay" 
    class="popup-overlay">
        <div class="remove-popup popup">
            <button class="cancel-button">
                <svg class="remove-icon"
                xmlns="http://www.w3.org/2000/svg" 
                viewBox="0 0 384 512"><path
                fill="#000000" 
                d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/>
                </svg>
            </button>
            <h2>Remover artigo</h2>
            <form id="remove-form">
                <div class="remove-input">
                    <p>ID do artigo</p>
                    <input id="remove-input" 
                    name="remove-id" 
                    type="number" 
                    required 
                    autocomplete="off">
                </div>
                <button id="remove-confirm" 
                type="submit">Confirmar</button>
            </form>
        </div>
    </div>
<script src="{{ url_for('static', filename='home.js') }}"></script>
</body>
</html>
