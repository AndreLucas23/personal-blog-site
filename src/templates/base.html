<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}Social Blog{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/logo.svg') }}" type="image/svg+xml">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/ui.css') }}">
    {% block styles %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main">Pular para o conteúdo</a>

    {% include 'partials/navbar.html' %}

    <div class="page {% block page_class %}{% endblock %}">
        {% block page %}{% endblock %}
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>

    <script type="module" src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
