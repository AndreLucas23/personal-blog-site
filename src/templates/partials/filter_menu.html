<div id="filter-menu-overlay"
class="add-menu__overlay filter-menu__overlay"></div>

<div
id="filter-menu"
class="pg__filter-menu">

        <div class="filter-menu__header">
            <div class="filter-menu__header-left">
                <div class="filter-menu__header-icon u-flex-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                        <path d="M96 128C83.1 128 71.4 135.8 66.4 147.8C61.4 159.8 64.2 173.5 73.4 182.6L256 365.3L256 480C256 488.5 259.4 496.6 265.4 502.6L329.4 566.6C338.6 575.8 352.3 578.5 364.3 573.5C376.3 568.5 384 556.9 384 544L384 365.3L566.6 182.7C575.8 173.5 578.5 159.8 573.5 147.8C568.5 135.8 556.9 128 544 128L96 128z"/>
                    </svg>
                </div>

                <div>
                    <h3 class="filter-menu__title">Filtrar Artigos</h3>
                    <p class="filter-menu__subtitle">Busque por título ou ID do artigo</p>
                </div>
            </div>

            <button class="filter-menu__hide-btn u-flex-center"
            id="filter-menu-hide-btn"
            aria-label="Fechar filtro">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                    <path d="M342.6 105.4C330.1 92.9 309.8 92.9 297.3 105.4L137.3 265.4C124.8 277.9 124.8 298.2 137.3 310.7C149.8 323.2 170.1 323.2 182.6 310.7L320 173.3L457.4 310.6C469.9 323.1 490.2 323.1 502.7 310.6C515.2 298.1 515.2 277.8 502.7 265.3L342.7 105.3zM502.6 457.4L342.6 297.4C330.1 284.9 309.8 284.9 297.3 297.4L137.3 457.4C124.8 469.9 124.8 490.2 137.3 502.7C149.8 515.2 170.1 515.2 182.6 502.7L320 365.3L457.4 502.6C469.9 515.1 490.2 515.1 502.7 502.6C515.2 490.1 515.2 469.8 502.7 457.3z"/>
                </svg>
            </button>
        </div>

        <div class="filter-menu__divider"></div>

        <form class="filter-menu__form"
        id="filter-form"
        novalidate>

            <div class="filter-menu__field">
                <label class="filter-menu__label"
                for="filter-select">
                    <svg class="filter-menu__label-icon"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M96 128C83.1 128 71.4 135.8 66.4 147.8C61.4 159.8 64.2 173.5 73.4 182.6L256 365.3L256 480C256 488.5 259.4 496.6 265.4 502.6L329.4 566.6C338.6 575.8 352.3 578.5 364.3 573.5C376.3 568.5 384 556.9 384 544L384 365.3L566.6 182.7C575.8 173.5 578.5 159.8 573.5 147.8C568.5 135.8 556.9 128 544 128L96 128z"/>
                    </svg>
                    Filtrar por
                </label>

                <div class="filter-menu__input-wrap filter-menu__select-wrap">
                    <select class="filter-menu__input filter-menu__select"
                    id="filter-select"
                    name="filter-type"
                    aria-label="Tipo de filtro">
                        <option value="title">Título</option>
                        <option value="id">ID</option>
                    </select>

                    <svg class="filter-menu__select-arrow"
                    aria-hidden="true"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M169.4 278.6C181.9 266.1 202.2 266.1 214.6 278.6L320 384L425.4 278.6C437.9 266.1 458.2 266.1 470.6 278.6C483.1 291.1 483.1 311.4 470.6 323.9L342.6 451.9C330.1 464.4 309.8 464.4 297.3 451.9L169.3 323.9C156.9 311.4 156.9 291.1 169.4 278.6z"/>
                    </svg>
                </div>
            </div>

            <div class="filter-menu__field">
                <label class="filter-menu__label"
                for="filter-input">
                    <svg class="filter-menu__label-icon"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M416 208C416 322.9 322.9 416 208 416C93.1 416 0 322.9 0 208C0 93.1 93.1 0 208 0C322.9 0 416 93.1 416 208zM361.4 382.1C322.6 415.8 272.2 436 216 436C97 436 0 339 0 220C0 101 97 4 216 4C335 4 432 101 432 220C432 276.1 411.8 326.6 378.1 365.4L633.4 620.6C645.9 633.1 645.9 653.4 633.4 665.9C620.9 678.4 600.6 678.4 588.1 665.9L361.4 382.1z"/>
                    </svg>
                    Busca
                </label>

                <div class="filter-menu__input-wrap">
                    <input class="filter-menu__input filter-menu__search-input"
                    id="filter-input"
                    name="filter-query"
                    type="text"
                    placeholder="Digite para buscar…"
                    autocomplete="off">

                    <button class="filter-menu__clear-btn"
                    id="filter-clear-input-btn"
                    type="button"
                    aria-label="Limpar busca"
                    hidden>
                        <svg aria-hidden="true"
                        viewBox="0 0 640 640"
                        xmlns="http://www.w3.org/2000/svg">
                            <path d="M342.6 297.4C330.1 284.9 309.8 284.9 297.3 297.4L169.4 425.4C156.9 437.9 156.9 458.2 169.4 470.6C181.9 483.1 202.2 483.1 214.6 470.6L320 365.3L425.4 470.6C437.9 483.1 458.2 483.1 470.6 470.6C483.1 458.1 483.1 437.8 470.6 425.4L342.6 297.4zM297.4 342.6L169.4 214.6C156.9 202.1 156.9 181.8 169.4 169.4C181.9 156.9 202.2 156.9 214.6 169.4L320 274.7L425.4 169.4C437.9 156.9 458.2 156.9 470.6 169.4C483.1 181.9 483.1 202.2 470.6 214.6L342.6 342.6C330.1 355.1 309.8 355.1 297.4 342.6z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="filter-menu__status"
            id="filter-status"
            aria-live="polite"></div>

            <div class="filter-menu__actions">
                <button class="filter-menu__cancel-btn"
                id="filter-clear-btn"
                type="button">Limpar filtro</button>
            </div>

        </form>
</div>
