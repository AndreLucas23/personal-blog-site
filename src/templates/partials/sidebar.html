<aside class="pg__aside">
    <nav class="aside__nav" aria-label="Navegação principal">
        <div class="aside__item">
            <a class="aside__link u-flex-center u-transition-02s-ease"
            href="{{ url_for('views.home') }}#home"
            aria-label="Início">
                <svg class="aside__icon"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M341.8 72.6C329.5 61.2 310.5 61.2 298.3 72.6L74.3 280.6C64.7 289.6 61.5 303.5 66.3 315.7C71.1 327.9 82.8 336 96 336L112 336L112 512C112 547.3 140.7 576 176 576L464 576C499.3 576 528 547.3 528 512L528 336L544 336C557.2 336 569 327.9 573.8 315.7C578.6 303.5 575.4 289.5 565.8 280.6L341.8 72.6zM304 384L336 384C362.5 384 384 405.5 384 432L384 528L256 528L256 432C256 405.5 277.5 384 304 384z"/>
                </svg>
            </a>

            <span class="aside__popup u-secondary-grey-bg u-flex-center">Início</span>
        </div>

        <div class="aside__item">
            <a class="aside__link u-flex-center u-transition-02s-ease"
            href="{{ url_for('views.home') }}#articles"
            aria-label="Artigos">
                <svg class="aside__icon"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M32 176C32 134.5 63.6 100.4 104 96.4L104 96L384 96C437 96 480 139 480 192L480 368L304 368C264.2 368 232 400.2 232 440L232 500C232 524.3 212.3 544 188 544C163.7 544 144 524.3 144 500L144 272L80 272C53.5 272 32 250.5 32 224L32 176zM268.8 544C275.9 530.9 280 515.9 280 500L280 440C280 426.7 290.7 416 304 416L552 416C565.3 416 576 426.7 576 440L576 464C576 508.2 540.2 544 496 544L268.8 544zM112 144C94.3 144 80 158.3 80 176L80 224L144 224L144 176C144 158.3 129.7 144 112 144z"/>
                </svg>
            </a>

            <span class="aside__popup u-secondary-grey-bg u-flex-center">Artigos</span>
        </div>

        <div class="aside__item">
            <a class="aside__link u-flex-center u-transition-02s-ease"
            href="{{ url_for('views.home') }}#social"
            aria-label="Social">
                <svg class="aside__icon"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M96 192C96 130.1 146.1 80 208 80C269.9 80 320 130.1 320 192C320 253.9 269.9 304 208 304C146.1 304 96 253.9 96 192zM32 528C32 430.8 110.8 352 208 352C305.2 352 384 430.8 384 528L384 534C384 557.2 365.2 576 342 576L74 576C50.8 576 32 557.2 32 534L32 528zM464 128C517 128 560 171 560 224C560 277 517 320 464 320C411 320 368 277 368 224C368 171 411 128 464 128zM464 368C543.5 368 608 432.5 608 512L608 534.4C608 557.4 589.4 576 566.4 576L421.6 576C428.2 563.5 432 549.2 432 534L432 528C432 476.5 414.6 429.1 385.5 391.3C408.1 376.6 435.1 368 464 368z"/>
                </svg>
            </a>

            <span class="aside__popup u-secondary-grey-bg u-flex-center">Social</span>
        </div>
        <div class="aside__account">
            {% if current_user.is_authenticated %}
            {% if current_user.is_admin %}
            <div class="aside__item">
                <a class="aside__link u-flex-center u-transition-02s-ease"
                href="{{ url_for('views.admin') }}"
                aria-label="Painel de administração">
                    <svg class="aside__icon"
                    aria-hidden="true"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <rect x="96" y="96" width="192" height="192" rx="40"/>
                        <rect x="352" y="96" width="192" height="192" rx="40"/>
                        <rect x="96" y="352" width="192" height="192" rx="40"/>
                        <rect x="352" y="352" width="192" height="192" rx="40"/>
                    </svg>
                </a>

                <span class="aside__popup u-secondary-grey-bg u-flex-center">Painel</span>
            </div>
            {% endif %}

            <div class="aside__item">
                <a class="aside__link u-flex-center u-transition-02s-ease"
                href="{{ url_for('auth.logout') }}"
                aria-label="Sair da conta {{ current_user.username }}">
                    <svg class="aside__icon"
                    aria-hidden="true"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M256 160L160 160C151.2 160 144 167.2 144 176L144 464C144 472.8 151.2 480 160 480L256 480C273.7 480 288 494.3 288 512C288 529.7 273.7 544 256 544L160 544C115.8 544 80 508.2 80 464L80 176C80 131.8 115.8 96 160 96L256 96C273.7 96 288 110.3 288 128C288 145.7 273.7 160 256 160z"/>
                        <path transform="translate(192 0)" d="M246.6 169.4C234.1 156.9 213.8 156.9 201.3 169.4C188.8 181.9 188.8 202.2 201.3 214.7L274.6 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L274.7 352L201.4 425.4C188.9 437.9 188.9 458.2 201.4 470.7C213.9 483.2 234.2 483.2 246.7 470.7L374.7 342.7C387.2 330.2 387.2 309.9 374.7 297.4L246.7 169.4z"/>
                    </svg>
                </a>

                <span class="aside__popup u-secondary-grey-bg u-flex-center">Sair</span>
            </div>
            {% else %}
            <div class="aside__item">
                <a class="aside__link u-flex-center u-transition-02s-ease"
                href="{{ url_for('auth.login') }}"
                aria-label="Entrar">
                    <svg class="aside__icon"
                    aria-hidden="true"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <path d="M384 96L480 96C524.2 96 560 131.8 560 176L560 464C560 508.2 524.2 544 480 544L384 544C366.3 544 352 529.7 352 512C352 494.3 366.3 480 384 480L480 480C488.8 480 496 472.8 496 464L496 176C496 167.2 488.8 160 480 160L384 160C366.3 160 352 145.7 352 128C352 110.3 366.3 96 384 96z"/>
                        <path d="M246.6 169.4C234.1 156.9 213.8 156.9 201.3 169.4C188.8 181.9 188.8 202.2 201.3 214.7L274.6 288L96 288C78.3 288 64 302.3 64 320C64 337.7 78.3 352 96 352L274.7 352L201.4 425.4C188.9 437.9 188.9 458.2 201.4 470.7C213.9 483.2 234.2 483.2 246.7 470.7L374.7 342.7C387.2 330.2 387.2 309.9 374.7 297.4L246.7 169.4z"/>
                    </svg>
                </a>

                <span class="aside__popup u-secondary-grey-bg u-flex-center">Entrar</span>
            </div>

            <div class="aside__item">
                <a class="aside__link u-flex-center u-transition-02s-ease"
                href="{{ url_for('auth.register') }}"
                aria-label="Criar conta">
                    <svg class="aside__icon"
                    aria-hidden="true"
                    viewBox="0 0 640 640"
                    xmlns="http://www.w3.org/2000/svg">
                        <circle cx="256" cy="200" r="104"/>
                        <path d="M64 544C64 437.9 150 352 256 352C362 352 448 437.9 448 544Z"/>
                        <rect x="496" y="208" width="48" height="176" rx="24"/>
                        <rect x="432" y="272" width="176" height="48" rx="24"/>
                    </svg>
                </a>

                <span class="aside__popup u-secondary-grey-bg u-flex-center">Criar conta</span>
            </div>
            {% endif %}
        </div>
    </nav>
</aside>
