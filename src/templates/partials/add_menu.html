<div id="add-menu-overlay"
class="add-menu__overlay"></div>

<div
id="add-menu"
class="pg__add-menu">

    <div class="add-menu__header">
        <div class="add-menu__header-left">
            <div class="add-menu__header-icon u-flex-center">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM232 344l0-64-64 0c-13.3 0-24-10.7-24-24s10.7-24 24-24l64 0 0-64c0-13.3 10.7-24 24-24s24 10.7 24 24l0 64 64 0c13.3 0 24 10.7 24 24s-10.7 24-24 24l-64 0 0 64c0 13.3-10.7 24-24 24s-24-10.7-24-24z"/>
                </svg>
            </div>

            <div>
                <h3 class="add-menu__title">Novo Artigo</h3>
                <p class="add-menu__subtitle">Preencha os campos abaixo para publicar</p>
            </div>
        </div>

        <button class="add-menu__hide-btn u-flex-center"
        id="add-menu-hide-btn"
        aria-label="Fechar menu">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                <path d="M342.6 105.4C330.1 92.9 309.8 92.9 297.3 105.4L137.3 265.4C124.8 277.9 124.8 298.2 137.3 310.7C149.8 323.2 170.1 323.2 182.6 310.7L320 173.3L457.4 310.6C469.9 323.1 490.2 323.1 502.7 310.6C515.2 298.1 515.2 277.8 502.7 265.3L342.7 105.3zM502.6 457.4L342.6 297.4C330.1 284.9 309.8 284.9 297.3 297.4L137.3 457.4C124.8 469.9 124.8 490.2 137.3 502.7C149.8 515.2 170.1 515.2 182.6 502.7L320 365.3L457.4 502.6C469.9 515.1 490.2 515.1 502.7 502.6C515.2 490.1 515.2 469.8 502.7 457.3z"/>
            </svg>
        </button>
    </div>

    <div class="add-menu__divider"></div>

    <form class="add-menu__form"
    id="add-form"
    novalidate>

        <div class="add-menu__field">
            <label class="add-menu__label"
            for="add-input-title">
                <svg class="add-menu__label-icon"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M96 128C96 110.3 110.3 96 128 96L224 96C241.7 96 256 110.3 256 128C256 145.7 241.7 160 224 160L208 160L208 272L432 272L432 160L416 160C398.3 160 384 145.7 384 128C384 110.3 398.3 96 416 96L512 96C529.7 96 544 110.3 544 128C544 145.7 529.7 160 512 160L496 160L496 480L512 480C529.7 480 544 494.3 544 512C544 529.7 529.7 544 512 544L416 544C398.3 544 384 529.7 384 512C384 494.3 398.3 480 416 480L432 480L432 336L208 336L208 480L224 480C241.7 480 256 494.3 256 512C256 529.7 241.7 544 224 544L128 544C110.3 544 96 529.7 96 512C96 494.3 110.3 480 128 480L144 480L144 160L128 160C110.3 160 96 145.7 96 128z"/>
                </svg>
                Título
            </label>

            <div class="add-menu__input-wrap">
                <input class="add-menu__input"
                id="add-input-title"
                name="new-title"
                type="text"
                placeholder="Digite o título do artigo…"
                autocomplete="off"
                maxlength="30"
                required>
            </div>

            <span class="add-menu__error"
            id="title-error"
            aria-live="polite"></span>

            <span id="title-counter"
            class="add-menu__counter">0 / 30</span>
        </div>

        <div class="add-menu__field">
            <label class="add-menu__label"
            for="add-input-content">
                <svg class="add-menu__label-icon"
                viewBox="0 0 640 640"
                xmlns="http://www.w3.org/2000/svg">
                    <path d="M544 128C544 110.3 529.7 96 512 96L128 96C110.3 96 96 110.3 96 128C96 145.7 110.3 160 128 160L512 160C529.7 160 544 145.7 544 128zM544 384C544 366.3 529.7 352 512 352L128 352C110.3 352 96 366.3 96 384C96 401.7 110.3 416 128 416L512 416C529.7 416 544 401.7 544 384zM96 256C96 273.7 110.3 288 128 288L512 288C529.7 288 544 273.7 544 256C544 238.3 529.7 224 512 224L128 224C110.3 224 96 238.3 96 256zM544 512C544 494.3 529.7 480 512 480L128 480C110.3 480 96 494.3 96 512C96 529.7 110.3 544 128 544L512 544C529.7 544 544 529.7 544 512z"/>
                </svg>
                Conteúdo
            </label>

            <div class="add-menu__input-wrap">
                <textarea class="add-menu__input add-menu__textarea"
                id="add-input-content"
                name="new-content"
                placeholder="Escreva o conteúdo do artigo…"
                maxlength="2500"
                rows="5"></textarea>
            </div>

            <span id="content-counter"
            class="add-menu__counter">0 / 2500</span>
        </div>

        <div class="add-menu__actions">
            <button class="add-menu__cancel-btn"
            id="add-menu-cancel-btn"
            type="button">Cancelar</button>
            <button class="add-menu__submit-btn"
            id="add-submit-btn"
            type="submit">
                <span class="add-menu__submit-text">Publicar artigo</span>

                <span class="add-menu__submit-spinner"
                aria-hidden="true"></span>
            </button>
        </div>

    </form>
</div>
