<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar conta | Blog Pessoal</title>
</head>
<body>
    <main>
        <h1>Criar conta</h1>

        {% for message in get_flashed_messages() %}
        <p role="alert">{{ message }}</p>
        {% endfor %}

        <form method="post" action="{{ url_for('auth.register') }}">
            <label for="username">Nome de usuário</label>
            <input id="username" name="username" type="text" maxlength="50" required autofocus>

            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="255" required>

            <label for="password">Senha</label>
            <input id="password" name="password" type="password" minlength="8" maxlength="128" required>

            <button type="submit">Criar conta</button>
        </form>

        <a href="{{ url_for('auth.login') }}">Já tenho uma conta</a>
        <a href="{{ url_for('views.home') }}">Voltar ao blog</a>
    </main>
</body>
</html>
